name: "JellyTrend"
guid: "d3b07384-d9a1-4e2b-8c3f-1234567890ab"
version: "3.0.1.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
overview: "Syncs TMDB trending movies & shows with the local library and provides a Netflix-style banner carousel."
description: >
  JellyTrend automatically matches TMDB trending content against your
  Jellyfin library using provider IDs. Matched items are surfaced in a
  full-width banner carousel on the home screen.
category: "MoviesAndShows"
owner: ".:BORNIOS:."
artifacts:
  - "Jellyfin.Plugin.JellyTrend.dll"
changelog: >
  Novedades en 3.0.1:
  - Reproducción en Android TV: los ítems de los canales vuelven a abrirse. Jellyfin asigna el id del ítem de canal a las fuentes de medios y Android TV lo devuelve en PlaybackInfo; el plugin ya no fuerza el id del ítem de biblioteca.
  - Sin duplicados: las sombras de los canales se marcan como virtuales y se desvinculan de personas, géneros, estudios, tags y provider ids, así que no aparecen en la búsqueda ni en las páginas de actores/géneros. El detalle del canal conserva título, sinopsis, nota, duración e imágenes.
  - Banner sin permisos de escritura: el script se inyecta en memoria al servir index.html; ya no se modifica jellyfin-web y funciona con Jellyfin como servicio de Windows (Servicio de red).
  - PostgreSQL como almacén autoritativo, con copia JSON opcional y sin retorno silencioso a archivos obsoletos.
  - Recomendaciones: normalización global de afinidades, personas recurrentes, puntuaciones persistidas y exclusión estricta de títulos ya vistos o en curso.
  - Carrusel: carga dirigida por eventos, solo en Inicio, sin peticiones anónimas y con URLs de imagen escaladas por Jellyfin.
  - Compatibilidad: Jellyfin 12.1.x con .NET 10. Para Jellyfin 10.11.x usa la version 2.0.4.
