<!DOCTYPE html>
<html lang="en">
<head>
    <title>JellyTrend</title>
    <meta charset="utf-8" />
    <style>
        /* Lenguaje visual homologado con el panel del proveedor PostgreSQL: variables propias, tarjetas y
           pestanas en forma de pildora sobre un fondo con degradado. Todo va prefijado y con ambito para no
           tocar el resto del panel de Jellyfin. */
        #jellyTrendConfigPage {
            --jt-bg: #0b1020;
            --jt-bg-soft: #111935;
            --jt-card: rgba(18, 26, 48, 0.88);
            --jt-border: rgba(124, 146, 196, 0.28);
            --jt-text: #dbe7ff;
            --jt-muted: #9ab0d4;
            --jt-accent: #74b6ff;
            --jt-good: #6bc47f;
            --jt-warn: #f3c969;
            --jt-bad: #ef9a9a;
        }

        #jellyTrendConfigPage .content-primary {
            background:
                radial-gradient(1200px 500px at -15% -20%, rgba(82, 132, 255, 0.24), transparent 60%),
                radial-gradient(900px 420px at 110% 0%, rgba(104, 194, 255, 0.2), transparent 55%),
                linear-gradient(180deg, var(--jt-bg-soft), var(--jt-bg));
            border: 1px solid rgba(144, 170, 225, 0.22);
            border-radius: 14px;
            padding: 18px;
            color: var(--jt-text);
        }

        #jellyTrendConfigPage .jtTitle {
            margin: 4px 0 6px;
            font-size: 1.5rem;
            letter-spacing: 0.2px;
        }

        #jellyTrendConfigPage .jtIntro {
            color: var(--jt-muted);
            margin: 0 0 16px;
            line-height: 1.55;
        }

        #jellyTrendConfigPage .jtBanner {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-weight: 500;
        }

        #jellyTrendConfigPage .jt-tabbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(144, 170, 225, 0.25);
            padding-bottom: 10px;
        }

        #jellyTrendConfigPage .jt-tab-btn {
            border-radius: 999px !important;
            padding: 8px 16px !important;
            border: 1px solid rgba(123, 156, 226, 0.25);
            background: rgba(22, 32, 58, 0.75);
            color: #d6e4ff;
            cursor: pointer;
        }

        #jellyTrendConfigPage .jt-tab-btn:hover {
            background: rgba(38, 54, 92, 0.9);
        }

        #jellyTrendConfigPage .jt-tab-btn.button-submit {
            background: linear-gradient(135deg, #3a6dd8, #5a8ff0) !important;
            border-color: rgba(140, 190, 255, 0.55);
            color: #fff;
        }

        #jellyTrendConfigPage .jt-card {
            background: var(--jt-card);
            border: 1px solid var(--jt-border);
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
            margin-bottom: 16px;
        }

        #jellyTrendConfigPage .jtCardTitle {
            margin: 0 0 12px;
            font-size: 1.1rem;
            letter-spacing: 0.2px;
        }

        #jellyTrendConfigPage .jt-card-muted {
            background: rgba(21, 31, 57, 0.7);
            margin-bottom: 0;
        }

        #jellyTrendConfigPage .fieldDescription {
            color: var(--jt-muted);
        }

        #jellyTrendConfigPage .jtLink {
            color: var(--jt-accent);
        }

        #jellyTrendConfigPage .jtPanel[hidden] {
            display: none;
        }

        #jellyTrendConfigPage .jtKV {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        #jellyTrendConfigPage .jtKV td {
            padding: 5px 10px 5px 0;
            vertical-align: top;
            border-bottom: 1px solid rgba(124, 146, 196, 0.14);
        }

        #jellyTrendConfigPage .jtKV td:first-child {
            color: var(--jt-muted);
            white-space: nowrap;
            width: 1%;
        }

        #jellyTrendConfigPage .jtTableWrap {
            max-height: 420px;
            overflow: auto;
            border: 1px solid var(--jt-border);
            border-radius: 8px;
            background: rgba(9, 14, 28, 0.55);
        }

        #jellyTrendConfigPage .jtTableWrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        #jellyTrendConfigPage .jtTableWrap th {
            position: sticky;
            top: 0;
            text-align: left;
            padding: 8px 10px;
            background: rgba(13, 20, 38, 0.94);
            border-bottom: 1px solid var(--jt-border);
            color: #cfe0ff;
            font-weight: 600;
            white-space: nowrap;
        }

        #jellyTrendConfigPage .jtTableWrap td {
            padding: 7px 10px;
            border-bottom: 1px solid rgba(124, 146, 196, 0.14);
            vertical-align: top;
        }

        #jellyTrendConfigPage .jtTableWrap tbody tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        #jellyTrendConfigPage :focus-visible {
            outline: 2px solid var(--jt-accent);
            outline-offset: 2px;
        }

        @media (max-width: 767px) {
            #jellyTrendConfigPage .content-primary { padding: 12px; border-radius: 10px; }
            #jellyTrendConfigPage .jt-tabbar { overflow-x: auto; padding-bottom: 8px; }
        }
    </style>
</head>
<body>
<div id="jellyTrendConfigPage"
     data-role="page"
     data-pluginuniqueid="d3b07384-d9a1-4e2b-8c3f-1234567890ab"
     class="page type-interior pluginConfigurationPage"
     data-require="emby-input,emby-button,emby-select,emby-checkbox">

    <!-- Copia corta de las reglas DENTRO del cuerpo. Jellyfin inyecta el cuerpo de la pagina en su propio
         panel y el <style> declarado en el <head> no llega: por eso esta pagina se veia sin fondo, sin
         tarjetas y con las pestanas planas. El proveedor PostgreSQL hace lo mismo, solo que reparte los
         estilos en linea sobre cada objeto. Aqui se hace lo uno y lo otro. -->
    <style>
        #jellyTrendConfigPage .jt-card h2 { margin: 0 0 10px; font-size: 1.1rem; }
        #jellyTrendConfigPage .jtIntro { color: #9ab0d4; margin: 0 0 16px; line-height: 1.55; }
        #jellyTrendConfigPage .fieldDescription { color: #9ab0d4; }
        #jellyTrendConfigPage .jtPanel[hidden] { display: none; }
        #jellyTrendConfigPage .jtKV { width: 100%; border-collapse: collapse; font-size: .85rem; }
        #jellyTrendConfigPage .jtKV td { padding: 6px 10px; border-bottom: 1px solid rgba(124,146,196,.14); vertical-align: top; }
        #jellyTrendConfigPage .jtKV td:first-child { color: #9ab0d4; white-space: nowrap; width: 1%; }
        #jellyTrendConfigPage .jtTableWrap { max-height: 420px; overflow: auto; border: 1px solid rgba(124,146,196,.28); border-radius: 8px; background: rgba(9,14,28,.55); }
        #jellyTrendConfigPage .jtTableWrap table { width: 100%; border-collapse: collapse; font-size: .85rem; }
        #jellyTrendConfigPage .jtTableWrap th { position: sticky; top: 0; text-align: left; padding: 8px 10px; background: rgba(13,20,38,.94); border-bottom: 1px solid rgba(124,146,196,.28); color: #cfe0ff; font-weight: 600; white-space: nowrap; }
        #jellyTrendConfigPage .jtTableWrap td { padding: 7px 10px; border-bottom: 1px solid rgba(124,146,196,.14); vertical-align: top; }
        #jellyTrendConfigPage .jtTableWrap tbody tr:nth-child(even) { background: rgba(255,255,255,.02); }
        #jellyTrendConfigPage .jt-tab-btn { cursor: pointer; }
        #jellyTrendConfigPage :focus-visible { outline: 2px solid #74b6ff; outline-offset: 2px; }
    </style>

    <div data-role="content">
        <div class="content-primary" style="background:radial-gradient(1200px 500px at -15% -20%, rgba(82,132,255,.24), transparent 60%), radial-gradient(900px 420px at 110% 0%, rgba(104,194,255,.2), transparent 55%), linear-gradient(180deg,#111935,#0b1020); border:1px solid rgba(144,170,225,.22); border-radius:14px; padding:18px; color:#dbe7ff;">

            <h1 class="jtTitle" style="margin:4px 0 6px; font-size:1.5rem; letter-spacing:.2px;"><span data-jt="heading">JellyTrend</span></h1>
            <p class="jtIntro" data-jt-html="true" data-jt="intro_html"></p>

            <div id="jtBanner" class="jtBanner" style="display:none; padding:12px 16px; border-radius:8px; margin-bottom:18px; font-weight:500;"></div>

            <form id="jellyTrendConfigForm" onsubmit="return false;">
                <nav class="jt-tabbar" role="tablist" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; border-bottom:1px solid rgba(144,170,225,.25); padding-bottom:10px;">
                    <button type="button" class="jt-tab-btn raised emby-button" data-jt-tab="trending" aria-selected="true" style="border-radius:999px; padding:8px 16px; border:1px solid rgba(123,156,226,.25); background:rgba(22,32,58,.75); color:#d6e4ff; font-weight:600;">&#128200; <span data-jt="tabTrending"></span></button>
                    <button type="button" class="jt-tab-btn raised emby-button" data-jt-tab="recommendations" aria-selected="false" style="border-radius:999px; padding:8px 16px; border:1px solid rgba(123,156,226,.25); background:rgba(22,32,58,.75); color:#d6e4ff; font-weight:600;">&#10024; <span data-jt="tabRecommendations"></span></button>
                    <button type="button" class="jt-tab-btn raised emby-button" data-jt-tab="storage" aria-selected="false" style="border-radius:999px; padding:8px 16px; border:1px solid rgba(123,156,226,.25); background:rgba(22,32,58,.75); color:#d6e4ff; font-weight:600;">&#128190; <span data-jt="tabStorage"></span></button>
                    <button type="button" class="jt-tab-btn raised emby-button" data-jt-tab="status" aria-selected="false" style="border-radius:999px; padding:8px 16px; border:1px solid rgba(123,156,226,.25); background:rgba(22,32,58,.75); color:#d6e4ff; font-weight:600;">&#9881; <span data-jt="tabStatus"></span></button>
                </nav>

                <div class="jtPanel" data-jt-panel="trending">

                    <div class="jt-card" style="background:rgba(18,26,48,.88); border:1px solid rgba(124,146,196,.28); border-left:3px solid #42a5f5; border-radius:12px; padding:14px; box-shadow:0 10px 24px rgba(0,0,0,.2); margin-bottom:16px;">
                        <h2 class="jtCardTitle" data-jt="secTmdb"></h2>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="tmdbApiKey">
                            <span data-jt="lblTmdbApiKey"></span>
                        </label>
                        <input id="tmdbApiKey"
                               type="password"
                               is="emby-input"
                               data-jt-placeholder="phTmdbApiKey" />
                        <div class="fieldDescription" data-jt-html="true" data-jt="descTmdbApiKey_html"></div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="tmdbLanguage">
                            <span data-jt="lblTmdbLanguage"></span>
                        </label>
                        <input id="tmdbLanguage"
                               type="text"
                               is="emby-input"
                               data-jt-placeholder="phTmdbLanguage" />
                        <div class="fieldDescription" data-jt-html="true" data-jt="descTmdbLanguage_html"></div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="tmdbRegion">
                            <span data-jt="lblTmdbRegion"></span>
                        </label>
                        <input id="tmdbRegion"
                               type="text"
                               is="emby-input"
                               data-jt-placeholder="phTmdbRegion" />
                        <div class="fieldDescription" data-jt-html="true" data-jt="descTmdbRegion_html"></div>
                    </div>

                    </div>

                    <div class="jt-card" style="background:rgba(18,26,48,.88); border:1px solid rgba(124,146,196,.28); border-left:3px solid #42a5f5; border-radius:12px; padding:14px; box-shadow:0 10px 24px rgba(0,0,0,.2); margin-bottom:16px;">
                        <h2 class="jtCardTitle" data-jt="secTrending"></h2>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label>
                            <input id="enableChannel"
                                   type="checkbox"
                                   is="emby-checkbox" />
                            <span data-jt="lblChannel"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-jt-html="true" data-jt="descChannel_html"></div>
                    </div>

                    <div data-jt-html="true" data-jt="noteChannel_html" style="padding:10px 14px; border-radius:6px; background:#1a2a3a; border-left:4px solid #42a5f5; color:#90caf9; font-size:13px; line-height:1.6;"></div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="channelName">
                            <span data-jt="lblChannelName"></span>
                        </label>
                        <input id="channelName"
                               type="text"
                               is="emby-input"
                               data-jt-placeholder="phChannelName" />
                        <div class="fieldDescription" data-jt-html="true" data-jt="descChannelName_html"></div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="maxItems">
                            <span data-jt="lblMaxItems"></span>
                        </label>
                        <input id="maxItems"
                               type="number"
                               is="emby-input"
                               min="5"
                               max="100"
                               value="20" />
                        <div class="fieldDescription" data-jt-html="true" data-jt="descMaxItems_html"></div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label>
                            <input id="enableTrendingSeries"
                                   type="checkbox"
                                   is="emby-checkbox" />
                            <span data-jt="lblTrendingSeries"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-jt-html="true" data-jt="descTrendingSeries_html"></div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="trendingSeriesShare">
                            <span data-jt="lblSeriesShare"></span>
                        </label>
                        <input id="trendingSeriesShare"
                               type="number"
                               is="emby-input"
                               min="0"
                               max="100"
                               value="50" />
                        <div class="fieldDescription" data-jt-html="true" data-jt="descSeriesShare_html"></div>
                    </div>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label>
                            <input id="enableBannerMode"
                                   type="checkbox"
                                   is="emby-checkbox" />
                            <span data-jt="lblBanner"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-jt-html="true" data-jt="descBanner_html"></div>
                    </div>

                    </div>
                </div>

                <div class="jtPanel" data-jt-panel="recommendations" hidden>
                    <div class="jt-card" style="background:rgba(18,26,48,.88); border:1px solid rgba(124,146,196,.28); border-left:3px solid #ab47bc; border-radius:12px; padding:14px; box-shadow:0 10px 24px rgba(0,0,0,.2); margin-bottom:16px;">
                        <h2 class="jtCardTitle" data-jt="secRecommendations"></h2>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label>
                            <input id="enableRecommendationRow"
                                   type="checkbox"
                                   is="emby-checkbox" />
                            <span data-jt="lblRecommendationRow"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-jt-html="true" data-jt="descRecommendationRow_html"></div>
                    </div>
                    </div>

                    <div class="jt-card" style="background:rgba(18,26,48,.88); border:1px solid rgba(124,146,196,.28); border-left:3px solid #ab47bc; border-radius:12px; padding:14px; box-shadow:0 10px 24px rgba(0,0,0,.2); margin-bottom:16px;">
                        <h2 class="jtCardTitle" data-jt="secRecChannel"></h2>

                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label>
                            <input id="enableRecommendationChannel"
                                   type="checkbox"
                                   is="emby-checkbox" />
                            <span data-jt="lblRecChannel"></span>
                        </label>
                        <div class="fieldDescription checkboxFieldDescription" data-jt-html="true" data-jt="descRecChannel_html"></div>
                    </div>

                    <div data-jt-html="true" data-jt="noteRecChannel_html" style="padding:10px 14px; border-radius:6px; background:#2a2418; border-left:4px solid #f3c969; color:#f3c969; font-size:13px; line-height:1.6;"></div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="recommendationChannelName">
                            <span data-jt="lblRecommendationChannelName"></span>
                        </label>
                        <input id="recommendationChannelName"
                               type="text"
                               is="emby-input"
                               data-jt-placeholder="phRecommendationChannelName" />
                        <div class="fieldDescription" data-jt-html="true" data-jt="descRecommendationChannelName_html"></div>
                    </div>
                    </div>

                    <div class="jt-card" style="background:rgba(18,26,48,.88); border:1px solid rgba(124,146,196,.28); border-left:3px solid #ab47bc; border-radius:12px; padding:14px; box-shadow:0 10px 24px rgba(0,0,0,.2); margin-bottom:16px;">
                        <h2 class="jtCardTitle" data-jt="secEngine"></h2>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="recommendationMaxItems">
                            <span data-jt="lblRecommendationMaxItems"></span>
                        </label>
                        <input id="recommendationMaxItems"
                               type="number"
                               is="emby-input"
                               min="5"
                               max="100"
                               value="20" />
                        <div class="fieldDescription" data-jt-html="true" data-jt="descRecommendationMaxItems_html"></div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="recommendationRotationHours">
                            <span data-jt="lblRotation"></span>
                        </label>
                        <input id="recommendationRotationHours"
                               type="number"
                               is="emby-input"
                               min="0"
                               max="168"
                               value="1" />
                        <div class="fieldDescription" data-jt-html="true" data-jt="descRotation_html"></div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="recommendationPoolFactor">
                            <span data-jt="lblPoolFactor"></span>
                        </label>
                        <input id="recommendationPoolFactor"
                               type="number"
                               is="emby-input"
                               min="1"
                               max="10"
                               value="2" />
                        <div class="fieldDescription" data-jt-html="true" data-jt="descPoolFactor_html"></div>
                    </div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="coldStartMinWatched">
                            <span data-jt="lblColdStart"></span>
                        </label>
                        <input id="coldStartMinWatched"
                               type="number"
                               is="emby-input"
                               min="1"
                               max="200"
                               value="10" />
                        <div class="fieldDescription" data-jt-html="true" data-jt="descColdStart_html"></div>
                    </div>

                    </div>
                </div>

                <div class="jtPanel" data-jt-panel="storage" hidden>
                    <div class="jt-card" style="background:rgba(18,26,48,.88); border:1px solid rgba(124,146,196,.28); border-left:3px solid #26a69a; border-radius:12px; padding:14px; box-shadow:0 10px 24px rgba(0,0,0,.2); margin-bottom:16px;">
                        <h2 class="jtCardTitle" data-jt="secDataFolder"></h2>

                        <table class="jtKV"><tbody id="jtFolderInfo"></tbody></table>

                        <div id="jtPathNote" style="padding:10px 14px; border-radius:6px; background:#1a1a2e; border-left:4px solid #26a69a; color:#80cbc4; font-size:13px; line-height:1.6; margin-bottom:14px;"></div>

                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="jsonDataPath">
                            <span data-jt="lblDataPath"></span>
                        </label>
                        <input id="jsonDataPath"
                               type="text"
                               is="emby-input"
                               data-jt-placeholder="phDataPath" />
                        <div class="fieldDescription" data-jt-html="true" data-jt="descDataPath_html"></div>
                    </div>

                    </div>

                    <div class="jt-card" style="background:rgba(18,26,48,.88); border:1px solid rgba(124,146,196,.28); border-left:3px solid #26a69a; border-radius:12px; padding:14px; box-shadow:0 10px 24px rgba(0,0,0,.2); margin-bottom:16px;">
                        <h2 class="jtCardTitle" data-jt="secFiles"></h2>
                        <div id="jtFilesSummary" style="padding:10px 14px; border-radius:6px; background:#1a1a2e; color:#a0c4ff; font-size:14px; margin-bottom:12px;"></div>
                        <div id="jtFilesWrap" class="jtTableWrap" style="max-height:320px; overflow:auto; border:1px solid rgba(124,146,196,.28); border-radius:8px; background:rgba(9,14,28,.55)">
                            <table style="width:100%;border-collapse:collapse;font-size:.85rem">
                                <thead>
                                    <tr>
                                        <th data-jt="thFileName" style="position:sticky;top:0;text-align:left;padding:8px 10px;background:rgba(13,20,38,.94);border-bottom:1px solid rgba(124,146,196,.28);color:#cfe0ff;font-weight:600;white-space:nowrap"></th>
                                        <th data-jt="thFileSize" style="position:sticky;top:0;text-align:left;padding:8px 10px;background:rgba(13,20,38,.94);border-bottom:1px solid rgba(124,146,196,.28);color:#cfe0ff;font-weight:600;white-space:nowrap"></th>
                                        <th data-jt="thFileModified" style="position:sticky;top:0;text-align:left;padding:8px 10px;background:rgba(13,20,38,.94);border-bottom:1px solid rgba(124,146,196,.28);color:#cfe0ff;font-weight:600;white-space:nowrap"></th>
                                    </tr>
                                </thead>
                                <tbody id="jtFilesBody"></tbody>
                            </table>
                        </div>
                        <div class="fieldDescription" data-jt-html="true" data-jt="descFiles_html" style="margin-top:10px"></div>
                    </div>

                    <div class="jt-card" style="background:rgba(18,26,48,.88); border:1px solid rgba(124,146,196,.28); border-left:3px solid #26a69a; border-radius:12px; padding:14px; box-shadow:0 10px 24px rgba(0,0,0,.2); margin-bottom:16px;">
                        <h2 class="jtCardTitle" data-jt="secStore"></h2>

                        <div id="jtStoreNote" style="padding:10px 14px; border-radius:6px; background:#1a1a2e; border-left:4px solid #26a69a; color:#80cbc4; font-size:13px; line-height:1.6; margin-bottom:14px;"></div>

                        <div class="fieldDescription" data-jt-html="true" data-jt="descStore_html"></div>
                    </div>
                </div>

                <div data-jt-savebar>
                    <button is="emby-button"
                            type="button"
                            id="jellyTrendSaveBtn"
                            class="raised block emby-button"
                            style="background:linear-gradient(135deg,#1b5e20,#388e3c); color:#fff; border:1px solid rgba(76,175,80,.55); border-radius:10px; padding:11px 20px; font-weight:600; cursor:pointer;">
                        <span data-jt="btnSave"></span>
                    </button>
                </div>
                <div id="jtSaveStatus" data-jt-savebar style="margin-top:.5em;min-height:1.2em;font-size:.9em;"></div>

                <div class="jtPanel" data-jt-panel="status" hidden>
                    <div class="jt-card" style="background:rgba(18,26,48,.88); border:1px solid rgba(124,146,196,.28); border-left:3px solid #ffa726; border-radius:12px; padding:14px; box-shadow:0 10px 24px rgba(0,0,0,.2); margin-bottom:16px;">
                        <h2 class="jtCardTitle" data-jt="secState"></h2>

    function applyI18n() {

            var pk = el.getAttribute('data-jt-placeholder');

    function detectLangFallback() {
        var htmlLang = '';
        try {
            htmlLang = (document.documentElement.getAttribute('lang') || '').toLowerCase();
        } catch (e0) { /* ignore */ }
        if (htmlLang.indexOf('es') === 0) {

            return;

        try {

        } catch (e1) { /* ignore */ }

    function getCurrentUserId() {
        var api = getApiClient();
        if (!api) return null;

    // Fetches the current user's display language from the server. Each Jellyfin
    // user picks their own UI language (web → my preferences → display) regardless
    // of the server or admin language, so this must come fresh from the user
    // profile — never from a cached user object or the browser.
    function resolveServerCulture() {
        var api = getApiClient();
        var uid = getCurrentUserId();
        if (!uid) return Promise.resolve(null);

        var url = typeof api.getUrl === 'function' ? api.getUrl('Users/' + uid) : '/Users/' + encodeURIComponent(uid);
        var token = getAccessToken();
        var headers = token ? { 'Authorization': 'MediaBrowser Token="' + token + '"' } : {};

        return fetch(url, { credentials: 'include', headers: headers })
            .then(function (r) {
                if (!r.ok) throw new Error(String(r.status));
                return r.json();
            })
            .then(function (u) {
                // UICulture is the current preference; Culture may be stale.
                return (u && u.Configuration && (u.Configuration.UICulture || u.Configuration.Culture)) || null;
            })
            .catch(function () { return null; });
    }

    // The web client keeps the user's display language in localStorage (per-user)
    // and mirrors it into <html lang> — that is the language the UI is rendered
    // in. The server's Configuration.UICulture can be stale, so we trust the DOM
    // first and only query the server profile as a fallback.
    function refineLangFromServer() {
        var culture = null;
        try {
            culture = document.documentElement.getAttribute('lang');
        } catch (e0) { /* ignore */ }
        if (!culture) {
            try {
                culture = document.documentElement.getAttribute('data-culture');
            } catch (e1) { /* ignore */ }
        }

        if (culture) {
            console.info('[JellyTrend] UI culture → ' + culture);
            var c = String(culture).toLowerCase();
            currentLang = c.indexOf('es') === 0 ? 'es' : 'en';
            return Promise.resolve();
        }

        return resolveServerCulture().then(function (serverCulture) {
            if (serverCulture) {
                console.info('[JellyTrend] UI culture → ' + serverCulture + ' (server)');
                var c2 = String(serverCulture).toLowerCase();
                currentLang = c2.indexOf('es') === 0 ? 'es' : 'en';
            } else {
                console.info('[JellyTrend] UI culture → browser fallback');
                detectLangFallback();
            }
        });
    }

    function switchTab(name) {
        var page = findPage();
        if (!page) return;

        page.querySelectorAll('[data-jt-panel]').forEach(function (panel) {
            panel.hidden = panel.getAttribute('data-jt-panel') !== name;
        });

        page.querySelectorAll('[data-jt-tab]').forEach(function (btn) {
            var active = btn.getAttribute('data-jt-tab') === name;
            if (active) {
                btn.classList.add('button-submit');
                btn.classList.remove('button-default');
            } else {
                btn.classList.remove('button-submit');
                btn.classList.add('button-default');
            }

            // El color va tambien en linea para que la pestana activa se vea con su acento con o sin hoja
            // de estilos.
            var accent = TAB_COLORS[name] || TAB_COLORS.trending;
            btn.style.cssText = TAB_BASE + (active
                ? 'border:1px solid ' + accent.edge + '; background:' + accent.on + '; color:#fff;'
                : TAB_IDLE);

            btn.setAttribute('aria-selected', active ? 'true' : 'false');
        });

        // La barra de guardar solo pinta donde hay ajustes: en Estado no se guarda nada.
        page.querySelectorAll('[data-jt-savebar]').forEach(function (bar) {
            bar.hidden = name === 'status';
        });

        if (name === 'status') loadUsers();
    }

    function showBanner(message, kind) {
        var el = q('jtBanner');
        if (!el) return;

        el.textContent = message;
        el.style.display = '';
        if (kind === 'error') {
            el.style.background = 'rgba(58,27,27,.9)';
            el.style.color = '#ef9a9a';
            el.style.border = '1px solid #f44336';
        } else if (kind === 'success') {
            el.style.background = 'rgba(27,58,27,.9)';
            el.style.color = '#a5d6a7';
            el.style.border = '1px solid #4CAF50';
        } else {
            el.style.background = 'rgba(26,42,58,.9)';
            el.style.color = '#90caf9';
            el.style.border = '1px solid #42a5f5';
        }
    }

    function escapeText(value) {
        return String(value === null || value === undefined ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function chip(text, kind) {
        return '<span style="display:inline-block; padding:4px 12px; border-radius:999px; font-size:12px;'
            + ' font-weight:600; margin:0 6px 6px 0; ' + (CHIP_COLORS[kind] || CHIP_COLORS.info) + '">'
            + escapeText(text) + '</span>';
    }

    function formatBytes(bytes) {
        var value = Number(bytes) || 0;
        if (value <= 0) return '0 B';
        var units = ['B', 'KB', 'MB', 'GB'];
        var index = 0;
        while (value >= 1024 && index < units.length - 1) { value = value / 1024; index++; }
        return (index === 0 ? value : value.toFixed(1)) + ' ' + units[index];
    }

    // Los canales se muestran por su nombre, que es lo que el administrador ve en Canales, y no por un
    // "si" que no dice nada.
    function publishedChannels(status) {
        var names = [];
        if (status.EnableChannel) names.push(status.ChannelName || t('tabTrending'));
        if (status.EnableRecommendationChannel) names.push(status.RecommendationChannelName || t('tabRecommendations'));
        return names.length ? escapeText(names.join(' \u00b7 ')) : t('valNone');
    }

    // Convierte un valor de input en entero dentro de un rango. No vale `parseInt(x) || def` porque 0 es un
    // valor legitimo (rotacion desactivada, cero por ciento de series) y se perderia.
    function intInRange(value, min, max, fallback) {
        var parsed = Number.parseInt(value, 10);
        if (isNaN(parsed)) return fallback;
        return Math.min(max, Math.max(min, parsed));
    }

    function load() {
        var dash = getDashboard();
        if (dash && dash.showLoadingMsg) dash.showLoadingMsg();

        getConfig()
            .then(function (cfg) {
                var apiKey = q('tmdbApiKey');
                var max = q('maxItems');
                var banner = q('enableBannerMode');
                var channel = q('enableChannel');
                var tmdbLang = q('tmdbLanguage');
                var tmdbRegion = q('tmdbRegion');
                var channelName = q('channelName');
                var trendingSeries = q('enableTrendingSeries');
                var recRow = q('enableRecommendationRow');
                var recChannelName = q('recommendationChannelName');
                var recMax = q('recommendationMaxItems');
                var seriesShare = q('trendingSeriesShare');
                var recChannel = q('enableRecommendationChannel');
                var rotation = q('recommendationRotationHours');
                var poolFactor = q('recommendationPoolFactor');
                var coldStart = q('coldStartMinWatched');
                var dataPath = q('jsonDataPath');

                if (apiKey) apiKey.value = cfg.TmdbApiKey || '';
                if (max) max.value = cfg.MaxItems || 20;
                if (banner) banner.checked = cfg.EnableBannerMode !== false;
                if (channel) channel.checked = cfg.EnableChannel !== false;
                if (tmdbLang) tmdbLang.value = cfg.TmdbLanguage || 'es-MX';
                if (tmdbRegion) tmdbRegion.value = cfg.TmdbRegion || 'MX';
                if (channelName) channelName.value = cfg.ChannelName || 'JellyTrend - Trending Now';
                if (trendingSeries) trendingSeries.checked = cfg.EnableTrendingSeries !== false;
                if (recRow) recRow.checked = cfg.EnableRecommendationRow !== false;
                if (recChannelName) recChannelName.value = cfg.RecommendationChannelName || 'Recomendados';
                if (recMax) recMax.value = cfg.RecommendationMaxItems || 20;
                if (seriesShare) seriesShare.value = cfg.TrendingSeriesShare === undefined || cfg.TrendingSeriesShare === null ? 50 : cfg.TrendingSeriesShare;
                if (recChannel) recChannel.checked = cfg.EnableRecommendationChannel !== false;
                if (rotation) rotation.value = cfg.RecommendationRotationHours === undefined || cfg.RecommendationRotationHours === null ? 1 : cfg.RecommendationRotationHours;
                if (poolFactor) poolFactor.value = cfg.RecommendationPoolFactor || 2;
                if (coldStart) coldStart.value = cfg.ColdStartMinWatched || 10;
                if (dataPath) dataPath.value = cfg.JsonDataPath || '';
            })
            .catch(function (err) {
                setStatus(t('errLoadCfg') + (err && err.message || err), true);
            })
            .finally(function () {
                if (dash && dash.hideLoadingMsg) dash.hideLoadingMsg();
            });
    }

    function save() {
        var dash = getDashboard();
        if (dash && dash.showLoadingMsg) dash.showLoadingMsg();

        getConfig()
            .then(function (cfg) {
                var apiKey = q('tmdbApiKey');
                var max = q('maxItems');
                var banner = q('enableBannerMode');
                var channel = q('enableChannel');
                var tmdbLang = q('tmdbLanguage');
                var tmdbRegion = q('tmdbRegion');
                var channelName = q('channelName');
                var trendingSeries = q('enableTrendingSeries');
                var recRow = q('enableRecommendationRow');
                var recChannelName = q('recommendationChannelName');
                var recMax = q('recommendationMaxItems');
                var seriesShare = q('trendingSeriesShare');
                var recChannel = q('enableRecommendationChannel');
                var rotation = q('recommendationRotationHours');
                var poolFactor = q('recommendationPoolFactor');
                var coldStart = q('coldStartMinWatched');
                var dataPath = q('jsonDataPath');

                cfg.TmdbApiKey = apiKey ? apiKey.value : cfg.TmdbApiKey;
                cfg.MaxItems = max ? (Number.parseInt(max.value, 10) || 20) : cfg.MaxItems;
                cfg.EnableBannerMode = banner ? banner.checked : cfg.EnableBannerMode;
                cfg.EnableChannel = channel ? channel.checked : cfg.EnableChannel;
                cfg.TmdbLanguage = tmdbLang ? tmdbLang.value.trim() : cfg.TmdbLanguage;
                cfg.TmdbRegion = tmdbRegion ? tmdbRegion.value.trim().toUpperCase() : cfg.TmdbRegion;
                cfg.ChannelName = channelName ? (channelName.value.trim() || 'JellyTrend - Trending Now') : cfg.ChannelName;
                cfg.EnableTrendingSeries = trendingSeries ? trendingSeries.checked : cfg.EnableTrendingSeries;
                cfg.EnableRecommendationRow = recRow ? recRow.checked : cfg.EnableRecommendationRow;
                cfg.RecommendationChannelName = recChannelName ? (recChannelName.value.trim() || 'Recomendados') : cfg.RecommendationChannelName;
                cfg.RecommendationMaxItems = recMax ? (Number.parseInt(recMax.value, 10) || 20) : cfg.RecommendationMaxItems;
                cfg.TrendingSeriesShare = seriesShare ? intInRange(seriesShare.value, 0, 100, 50) : cfg.TrendingSeriesShare;
                cfg.EnableRecommendationChannel = recChannel ? recChannel.checked : cfg.EnableRecommendationChannel;
                cfg.RecommendationRotationHours = rotation ? intInRange(rotation.value, 0, 168, 1) : cfg.RecommendationRotationHours;
                cfg.RecommendationPoolFactor = poolFactor ? intInRange(poolFactor.value, 1, 10, 2) : cfg.RecommendationPoolFactor;

    function runTask(taskKey, okKey, errKey, noTaskKey) {
        var token = getAccessToken();
        var headers = token ? { 'Authorization': 'MediaBrowser Token="' + token + '"' } : {};

        fetch('/ScheduledTasks', { credentials: 'include', headers: headers })
            .then(function (r) { return r.json(); })
            .then(function (tasks) {
                var task = null;
                for (var i = 0; i < tasks.length; i++) {
                    if (tasks[i].Key === taskKey) {
                        task = tasks[i];
                        break;
                    }
                }
                if (!task) throw new Error(t(noTaskKey));
                return fetch('/ScheduledTasks/Running/' + task.Id, {
                    method: 'POST',
                    credentials: 'include',
                    headers: headers
                });
            })
            .then(function () {
                setStatus(t(okKey), false);
                if (taskKey === 'JellyTrendSync') loadStatus();
            })
            .catch(function (err) {
                setStatus(t(errKey) + (err && err.message || err), true);
            });
    }

                if (el) el.textContent = t('errLoadStatus');
            });
    }

    function row(labelKey, value) {
        return '<tr><td style="' + CELL_LABEL + '">' + t(labelKey) + '</td><td style="' + CELL_VALUE + '">' + value + '</td></tr>';
    }

    // Lista de usuarios del servidor para el selector de la pestana Estado.
    function loadUsers() {
        var select = q('jtUserSelect');
        if (!select || select.getAttribute('data-loaded') === '1') return;

        var token = getAccessToken();
        fetch('/JellyTrend/Users', {
            credentials: 'include',
            headers: token ? { 'Authorization': 'MediaBrowser Token="' + token + '"' } : {}
        })
            .then(function (r) { return r.json(); })
            .then(function (users) {
                select.innerHTML = '';
                var placeholder = document.createElement('option');
                placeholder.value = '';
                placeholder.textContent = t('phUserSelect');
                select.appendChild(placeholder);

                (users || []).forEach(function (user) {
                    var option = document.createElement('option');
                    option.value = user.Id;
                    option.textContent = user.Name;
                    select.appendChild(option);
                });

                select.setAttribute('data-loaded', '1');
            })
            .catch(function (err) { showBanner(t('msgUsersError') + (err && err.message || err), 'error'); });
    }

    // Perfil y recomendaciones guardadas del usuario elegido.
    function loadUserRecommendations(userId) {
        var profile = q('jtUserProfile');
        var wrap = q('jtUserItems');
        var body = q('jtUserItemsBody');

        if (wrap) wrap.style.display = 'none';
        if (body) body.innerHTML = '';
        if (profile) profile.innerHTML = userId ? '<tr><td>' + t('stLoading') + '</td><td></td></tr>' : '';
        if (!userId) return;

        var token = getAccessToken();
        fetch('/JellyTrend/UserRecommendations?userId=' + encodeURIComponent(userId), {
            credentials: 'include',
            headers: token ? { 'Authorization': 'MediaBrowser Token="' + token + '"' } : {}
        })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                if (!data || !data.Username) return;

                var facets = '';
                if (data.Profile && data.Profile.Facets) {
                    facets = Object.keys(data.Profile.Facets).map(function (key) {
                        return key + ' ' + data.Profile.Facets[key];
                    }).join(', ');
                }

                if (profile) {
                    profile.innerHTML =
                        row('kvStored', data.StoredCount) +
                        row('kvAvailable', data.AvailableCount) +
                        row('kvUpdated', data.UpdatedAt ? new Date(data.UpdatedAt).toLocaleString() : t('valNever')) +
                        row('kvAffinities', (data.Profile && data.Profile.Affinities) || 0) +
                        row('kvPairs', (data.Profile && data.Profile.Pairs) || 0) +
                        row('kvConsumed', (data.Profile && data.Profile.Consumed) || 0) +
                        (facets ? row('kvUserProfile', escapeText(facets)) : '');
                }

                var items = data.Items || [];
                if (!items.length) {
                    if (profile) profile.innerHTML += '<tr><td></td><td>' + t('msgNoRecs') + '</td></tr>';
                    return;
                }

                if (!body || !wrap) return;
                items.forEach(function (item) {
                    var tr = document.createElement('tr');
                    [item.Name || '', item.ProductionYear || '', item.Genres || '', item.CommunityRating === null || item.CommunityRating === undefined ? '' : item.CommunityRating].forEach(function (value) {
                        var td = document.createElement('td');
                        td.style.cssText = CELL_VALUE;
                        td.textContent = value;
                        tr.appendChild(td);
                    });
                    body.appendChild(tr);
                });
                wrap.style.display = '';
            })
            .catch(function (err) { showBanner(t('msgUserError') + (err && err.message || err), 'error'); });
    }

    function bindUi() {
        if (state.wired) return;

        var saveBtn = q('jellyTrendSaveBtn');
        var runBtn = q('jtRunNow');
        var runRecBtn = q('jtRunRecNow');

        if (!saveBtn || !runBtn || !runRecBtn) return;

        saveBtn.addEventListener('click', save);
        runBtn.addEventListener('click', triggerSync);
        runRecBtn.addEventListener('click', triggerRecommendations);

        var page = findPage();
        if (page) {
            page.querySelectorAll('[data-jt-tab]').forEach(function (btn) {
                btn.addEventListener('click', function () {
                    switchTab(btn.getAttribute('data-jt-tab'));
                });
            });
            switchTab('trending');
        }

        var userSelect = q('jtUserSelect');
        if (userSelect) {
            userSelect.addEventListener('change', function () { loadUserRecommendations(userSelect.value); });
        }

        state.wired = true;
    }

    function scheduleRetry() {
        if (state.retryTimer) return;
        state.retryTimer = setTimeout(function () {
            state.retryTimer = null;
            bootstrap();
        }, 280);
    }

    function bootstrap() {
        if (!findPage()) { scheduleRetry(); return; }
        if (!hasDom()) { scheduleRetry(); return; }

        var now = Date.now();
        if (state.bootstrapped && (now - state.lastBootstrapAt) < 1200) return;
        state.lastBootstrapAt = now;

        var page = findPage();
        if (page && page.dataset && page.dataset.pluginuniqueid) {
            pluginId = page.dataset.pluginuniqueid;
        }

        refineLangFromServer().then(function () {
            return loadLocalization();
        }).then(function () {
            applyI18n();
            bindUi();
            if (!state.bootstrapped) {
                state.bootstrapped = true;
            }
            load();
            loadStatus();
        });
    }

    function bindPageShow() {
        var page = findPage();
        if (!page) { scheduleRetry(); return; }
        if (page.dataset && page.dataset.jtBound === '1') return;
        if (page.dataset) page.dataset.jtBound = '1';

        page.addEventListener('pageshow', function () {
            bootstrap();
        });
    }

    bindPageShow();

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
            bindPageShow();
            bootstrap();
        });
    } else {
        bootstrap();
    }

    globalThis.addEventListener('hashchange', function () {
        if (globalThis.location && globalThis.location.hash &&
            globalThis.location.hash.indexOf('configurationpage') !== -1 &&
            globalThis.location.hash.indexOf('JellyTrend') !== -1) {
            bindPageShow();
            bootstrap();
        }
    });
})();
    </script>
</div>
