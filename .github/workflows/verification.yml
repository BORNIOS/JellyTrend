name: Verificación

# Ejecuta la suite de pruebas del plugin y publica el resumen ejecutivo generado a partir del
# resultado real (docs/VERIFICACION-RESUMEN.md). El resumen queda en la pestaña Summary del job
# y como artefacto.
on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Pruebas y resumen ejecutivo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Ejecutar la suite y generar el resumen
        shell: pwsh
        run: ./Tools/Generar-ResumenEjecutivo.ps1

      - name: Publicar el resumen en el job
        if: always()
        shell: bash
        run: |
          if [ -f docs/VERIFICACION-RESUMEN.md ]; then
            cat docs/VERIFICACION-RESUMEN.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verificacion
          path: |
            docs/VERIFICACION-RESUMEN.md
            Tests/TestResults/*.trx
          if-no-files-found: warn
