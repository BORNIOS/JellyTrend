name: '📦 Release Plugin'

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Versión del release (ej: 2.0.0 o 2.0.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Publicar como prerelease (para pruebas)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # necesario para el changelog autogenerado entre tags

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Normalizar versión (4 partes)
        id: version
        run: |
          V="${{ github.event.inputs.release_version }}"
          PARTS=$(echo "$V" | awk -F. '{print NF}')
          if [ "$PARTS" -eq 1 ]; then V="${V}.0.0.0"
          elif [ "$PARTS" -eq 2 ]; then V="${V}.0.0"
          elif [ "$PARTS" -eq 3 ]; then V="${V}.0"
          fi
          echo "full=$V" >> "$GITHUB_OUTPUT"

      - name: Fijar versión en Directory.Build.props
        run: |
          sed -i "s#<Version>[^<]*</Version>#<Version>${{ steps.version.outputs.full }}</Version>#" Directory.Build.props
          sed -i "s#<AssemblyVersion>[^<]*</AssemblyVersion>#<AssemblyVersion>${{ steps.version.outputs.full }}</AssemblyVersion>#" Directory.Build.props
          sed -i "s#<FileVersion>[^<]*</FileVersion>#<FileVersion>${{ steps.version.outputs.full }}</FileVersion>#" Directory.Build.props

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.JellyTrend.sln

      - name: Build (Release)
        run: dotnet build Jellyfin.Plugin.JellyTrend.sln -c Release --no-restore

      - name: Publicar plugin
        run: dotnet publish Jellyfin.Plugin.JellyTrend/Jellyfin.Plugin.JellyTrend.csproj -c Release --no-build -o publish

      - name: Empaquetar ZIP + checksum
        id: package
        run: |
          cd publish
          zip -r "../Jellyfin.Plugin.JellyTrend-${{ steps.version.outputs.full }}.zip" Jellyfin.Plugin.JellyTrend.dll
          cd ..
          CHECKSUM=$(sha256sum "Jellyfin.Plugin.JellyTrend-${{ steps.version.outputs.full }}.zip" | awk '{print $1}')
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Actualizar manifest.json (repo)
        run: |
          VERSION="${{ steps.version.outputs.full }}"
          ZIP="Jellyfin.Plugin.JellyTrend-${VERSION}.zip"
          URL="https://github.com/${{ github.repository }}/releases/download/v${{ github.event.inputs.release_version }}/${ZIP}"
          CHECKSUM="${{ steps.package.outputs.checksum }}"
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --arg v "$VERSION" --arg url "$URL" --arg sum "$CHECKSUM" --arg ts "$TS" \
            '.[0].versions = (([.[0].versions[] | select(.version != $v)]) + [{version: $v, changelog: "Ver release notes en GitHub", targetAbi: "10.11.0.0", sourceUrl: $url, checksum: $sum, timestamp: $ts}])' \
            manifest.json > manifest.tmp.json && mv manifest.tmp.json manifest.json
          cp manifest.json publish/manifest.json

      - name: Actualizar build.yaml
        run: |
          sed -i "s/^version:.*/version: \"${{ steps.version.outputs.full }}\"/" build.yaml

      - name: Commit manifest actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json build.yaml
          git diff --cached --quiet || git commit -m "chore: actualizar manifest a v${{ steps.version.outputs.full }}"
          git push

      - name: Crear release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.release_version }}
          name: JellyTrend ${{ github.event.inputs.release_version }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease }}
          files: |
            Jellyfin.Plugin.JellyTrend-${{ steps.version.outputs.full }}.zip
            publish/manifest.json

